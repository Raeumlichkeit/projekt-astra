name: Update IMO meteor calendar

on:
  schedule:
    - cron: "17 5 15 7,8,9,10,11,12 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "pypdf==6.0.0"
      - name: Extract current and next IMO calendars
        run: |
          python scripts/update_imo_calendar.py \
            --years "$(date +%Y)" "$(( $(date +%Y) + 1 ))" \
            --output app/src/main/assets/imo_meteor_showers.json
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/imo_meteor_showers.json
          git diff --cached --quiet || git commit -m "data: update annual IMO meteor calendar"
          git push
