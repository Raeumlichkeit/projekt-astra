<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-__SCRIPT_NONCE__'; style-src 'unsafe-inline'; img-src data: https://tile.openstreetmap.org https://tilecache.rainviewer.com; connect-src https://api.rainviewer.com https://api.open-meteo.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>__LEAFLET_CSS__</style>
  <style>
    html, body { height: 100%; width: 100%; margin: 0; background: #07101f; overflow: hidden; }
    #map { position: absolute; inset: 0; min-height: 100vh; min-width: 100vw; }
    body { font-family: system-ui, sans-serif; color: #edf3ff; }
    .leaflet-control-attribution { background: rgba(7,16,31,.82) !important; color: #dbe8ff; }
    .leaflet-control-attribution a { color: #8eb8ff; }
    .base-map { filter: brightness(.64) saturate(.72) hue-rotate(178deg); }
    .panel {
      position: fixed; z-index: 10000; left: 55px; right: 10px; top: 10px;
      padding: 10px 12px; border-radius: 14px; background: rgba(7,16,31,.91);
      box-shadow: 0 6px 24px rgba(0,0,0,.38); backdrop-filter: blur(9px);
    }
    .row { display: flex; gap: 12px; align-items: center; }
    .row + .row { margin-top: 9px; }
    label { display: flex; align-items: center; gap: 5px; font-size: 13px; white-space: nowrap; }
    input[type=range] { flex: 1; accent-color: #6da8ff; min-width: 80px; }
    input[type=checkbox] { accent-color: #6da8ff; width: 17px; height: 17px; }
    button { border: 0; border-radius: 9px; color: #07101f; background: #ffd98a; padding: 7px 10px; font-weight: 700; }
    #time { margin-left: auto; color: #ffd98a; font-weight: 700; font-size: 13px; }
    #status { font-size: 11px; color: #aab8ce; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .location-dot { background:#6da8ff; border:3px solid white; border-radius:50%; box-shadow:0 0 0 7px rgba(109,168,255,.25); }
  </style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="row">
    <label><input id="rainToggle" type="checkbox" checked> Regenradar</label>
    <label><input id="cloudToggle" type="checkbox" checked> Bewölkung</label>
    <span id="time">–</span>
  </div>
  <div class="row">
    <button id="play" aria-label="Animation starten">▶</button>
    <input id="timeline" type="range" min="0" max="0" value="0">
  </div>
  <div id="status">Kartendaten werden geladen …</div>
</div>
<script nonce="__SCRIPT_NONCE__">__LEAFLET_JS__</script>
<script nonce="__SCRIPT_NONCE__">
(() => {
  const lat = __ASTRA_LAT__;
  const lon = __ASTRA_LON__;
  const mapElement = document.getElementById('map');
  function fitViewport() {
    const width = Math.max(window.innerWidth, 320);
    const height = Math.max(window.innerHeight, 360);
    document.documentElement.style.width = width + 'px';
    document.documentElement.style.height = height + 'px';
    document.body.style.width = width + 'px';
    document.body.style.height = height + 'px';
    mapElement.style.width = width + 'px';
    mapElement.style.height = height + 'px';
  }
  fitViewport();
  const map = L.map('map', { zoomControl: true }).setView([lat, lon], 7);
  window.astraMap = map;
  window.addEventListener('resize', () => { fitViewport(); map.invalidateSize(false); });
  setTimeout(() => map.invalidateSize(false), 350);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    className: 'base-map',
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  L.marker([lat, lon], {
    icon: L.divIcon({ className: 'location-dot', iconSize: [16,16], iconAnchor: [8,8] })
  }).addTo(map).bindPopup('Ungefährer Beobachtungsort (gerundet)');

  const rainToggle = document.getElementById('rainToggle');
  const cloudToggle = document.getElementById('cloudToggle');
  const timeline = document.getElementById('timeline');
  const timeLabel = document.getElementById('time');
  const status = document.getElementById('status');
  const play = document.getElementById('play');
  let radarFrames = [];
  let radarLayer = null;
  let radarHost = '';
  let cloudLayer = L.layerGroup().addTo(map);
  let animation = null;

  function showRadar(index) {
    if (!radarFrames.length) return;
    index = Math.max(0, Math.min(index, radarFrames.length - 1));
    if (radarLayer) map.removeLayer(radarLayer);
    const frame = radarFrames[index];
    radarLayer = L.tileLayer(radarHost + frame.path + '/256/{z}/{x}/{y}/2/1_1.png', {
      tileSize: 256, opacity: .72, maxNativeZoom: 7, maxZoom: 19,
      attribution: 'Radar: <a href="https://www.rainviewer.com/">RainViewer</a>'
    });
    if (rainToggle.checked) radarLayer.addTo(map);
    timeline.value = index;
    timeLabel.textContent = new Date(frame.time * 1000).toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'});
  }

  async function loadRadar() {
    try {
      const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      if (data.host !== 'https://tilecache.rainviewer.com') throw new Error('Unbekannte Radarquelle');
      radarHost = 'https://tilecache.rainviewer.com';
      const past = Array.isArray(data.radar?.past) ? data.radar.past : [];
      const nowcast = Array.isArray(data.radar?.nowcast) ? data.radar.nowcast : [];
      radarFrames = [...past, ...nowcast].slice(0, 32).filter(frame =>
        typeof frame.path === 'string' && /^\/v2\/radar\/[A-Za-z0-9_-]{1,64}$/.test(frame.path) &&
        Number.isFinite(frame.time));
      if (!radarFrames.length) throw new Error('Keine Radarframes');
      timeline.max = radarFrames.length - 1;
      showRadar(radarFrames.length - 1);
      status.textContent = 'Aktuell · Radar: RainViewer · Wolken: Open-Meteo';
    } catch (error) {
      status.textContent = 'Regenradar momentan nicht verfügbar';
    }
  }

  async function loadClouds() {
    const points = [];
    const step = 0.7;
    for (let y = -3; y <= 3; y++) {
      for (let x = -3; x <= 3; x++) points.push([
        Math.max(-90, Math.min(90, lat + y * step)), ((lon + x * step + 540) % 360) - 180
      ]);
    }
    const lats = points.map(p => p[0].toFixed(2)).join(',');
    const lons = points.map(p => p[1].toFixed(2)).join(',');
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=cloud_cover&forecast_days=1`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const values = await response.json();
      const rows = Array.isArray(values) ? values : [values];
      cloudLayer.clearLayers();
      rows.slice(0, points.length).forEach((row, i) => {
        const value = row.current?.cloud_cover;
        if (!Number.isFinite(value)) return;
        const cover = Math.max(0, Math.min(100, value));
        const p = points[i];
        L.rectangle([[p[0]-step/2,p[1]-step/2],[p[0]+step/2,p[1]+step/2]], {
          stroke: false,
          fillColor: cover > 75 ? '#d8e1ef' : cover > 40 ? '#aebbd0' : '#8da0bc',
          fillOpacity: .04 + cover / 100 * .48,
          interactive: false
        }).addTo(cloudLayer);
      });
    } catch (error) {
      status.textContent = 'Bewölkungsdaten momentan nicht verfügbar';
    }
  }

  timeline.addEventListener('input', () => showRadar(Number(timeline.value)));
  rainToggle.addEventListener('change', () => {
    if (!radarLayer) return;
    if (rainToggle.checked) radarLayer.addTo(map); else map.removeLayer(radarLayer);
  });
  cloudToggle.addEventListener('change', () => {
    if (cloudToggle.checked) cloudLayer.addTo(map); else map.removeLayer(cloudLayer);
  });
  play.addEventListener('click', () => {
    if (animation) {
      clearInterval(animation); animation = null; play.textContent = '▶'; return;
    }
    play.textContent = '■';
    animation = setInterval(() => {
      const next = (Number(timeline.value) + 1) % radarFrames.length;
      showRadar(next);
    }, 650);
  });

  loadRadar();
  loadClouds();
  setInterval(loadRadar, 5 * 60 * 1000);
  setInterval(loadClouds, 15 * 60 * 1000);
})();
</script>
</body>
</html>
