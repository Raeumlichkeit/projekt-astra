<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>__LEAFLET_CSS__</style>
  <style>
    html, body { height: 100%; width: 100%; margin: 0; background: #02050a; overflow: hidden; }
    #map { position: absolute; inset: 0; min-height: 100vh; min-width: 100vw; }
    body { font-family: system-ui, sans-serif; color: #edf3ff; }
    .leaflet-control-attribution { background: rgba(7,16,31,.86) !important; color: #dbe8ff; }
    .leaflet-control-attribution a { color: #8eb8ff; }
    .reference-map { filter: grayscale(.55) brightness(.92); }
    .legend {
      position: fixed; z-index: 10000; left: 55px; right: 10px; top: 10px;
      padding: 10px 12px; border-radius: 14px; background: rgba(7,16,31,.91);
      box-shadow: 0 6px 24px rgba(0,0,0,.42); backdrop-filter: blur(9px);
      font-size: 12px;
    }
    .legend strong { display: block; margin-bottom: 6px; color: #ffd98a; }
    .scale { height: 7px; border-radius: 5px; background: linear-gradient(90deg,#000,#241a3e,#8d4c32,#ffd787,#fff); }
    .labels { display:flex; justify-content:space-between; margin-top:4px; color:#c8d5e8; }
    .location-dot { background:#6da8ff; border:3px solid white; border-radius:50%; box-shadow:0 0 0 7px rgba(109,168,255,.25); }
  </style>
</head>
<body>
<div id="map"></div>
<div class="legend">
  <strong>Künstliches Nachtlicht</strong>
  <div class="scale"></div>
  <div class="labels"><span>dunkler</span><span>heller</span></div>
</div>
<script>__LEAFLET_JS__</script>
<script>
(() => {
  const lat = __ASTRA_LAT__;
  const lon = __ASTRA_LON__;
  const mapElement = document.getElementById('map');
  function fitViewport() {
    const width = Math.max(window.innerWidth, 320);
    const height = Math.max(window.innerHeight, 360);
    document.documentElement.style.width = width + 'px';
    document.documentElement.style.height = height + 'px';
    document.body.style.width = width + 'px';
    document.body.style.height = height + 'px';
    mapElement.style.width = width + 'px';
    mapElement.style.height = height + 'px';
  }
  fitViewport();
  const map = L.map('map', { zoomControl: true }).setView([lat, lon], 7);
  window.astraMap = map;
  window.addEventListener('resize', () => { fitViewport(); map.invalidateSize(false); });
  setTimeout(() => map.invalidateSize(false), 350);

  L.tileLayer(
    'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_CityLights_2012/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg',
    {
      minZoom: 1, maxNativeZoom: 8, maxZoom: 13,
      attribution: 'Nachtlicht: <a href="https://earthdata.nasa.gov/gibs">NASA GIBS / VIIRS</a>'
    }
  ).addTo(map);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    minZoom: 1, maxZoom: 19, opacity: .18, className: 'reference-map',
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  L.marker([lat, lon], {
    icon: L.divIcon({ className: 'location-dot', iconSize: [16,16], iconAnchor: [8,8] })
  }).addTo(map).bindPopup('Dein Beobachtungsort');
})();
</script>
</body>
</html>
